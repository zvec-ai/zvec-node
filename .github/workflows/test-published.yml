name: Test Published Package

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-published:
    name: Test Published (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 glibc
            runner: ubuntu-latest
          - name: Linux arm64 glibc
            runner: ubuntu-24.04-arm
          - name: macOS arm64
            runner: macos-latest
          - name: macOS x64
            runner: macos-15-intel
          - name: Windows x64
            runner: windows-latest
          - name: Windows arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Debug Environment
        run: node -p "process.platform + ' ' + process.arch"

      - name: Install Locked Test Tools
        run: npm ci --ignore-scripts

      - name: Test Published Package
        run: npm run test:package

  test-published-musl:
    name: Test Published (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 musl
            runner: ubuntu-24.04
          - name: Linux arm64 musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      MUSL_CONTAINER: zvec-node-published-musl

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Start musllinux Container
        run: |
          docker run -d --name "$MUSL_CONTAINER" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            node:22-alpine sleep infinity

      - name: Install Locked Test Tools
        run: docker exec "$MUSL_CONTAINER" npm ci --ignore-scripts

      - name: Test Published Package
        run: docker exec "$MUSL_CONTAINER" npm run test:package

      - name: Tear Down musllinux Container
        if: always()
        run: docker rm -f "$MUSL_CONTAINER" || true
