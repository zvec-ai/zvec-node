name: Publish to npm

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-linux-glibc-bindings:
    name: Publish Bindings (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: Linux x64 glibc
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
            cmake_url: https://cmake.org/files/v3.27/cmake-3.27.9-linux-x86_64.tar.gz
          - name: Linux arm64 glibc
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            cmake_url: https://cmake.org/files/v3.27/cmake-3.27.9-linux-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: |
          curl -sL ${{ matrix.cmake_url }} | tar xz -C /usr/local --strip-components=1
          npm install --ignore-scripts

      - name: Build and Publish Bindings
        run: npm run publish:bindings -- --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-linux-musl-bindings:
    name: Publish Bindings (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: Linux x64 musl
            runner: ubuntu-24.04
            image: quay.io/pypa/musllinux_1_2_x86_64:2026.03.01-1
          - name: Linux arm64 musl
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/musllinux_1_2_aarch64:2026.03.01-1
    runs-on: ${{ matrix.runner }}
    env:
      MUSL_CONTAINER: zvec-node-publish-musl
      MUSL_PATH: /opt/python/cp310-cp310/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start musllinux Container
        run: |
          docker run -d --name "$MUSL_CONTAINER" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PATH="$MUSL_PATH" \
            "${{ matrix.image }}" sleep infinity

      - name: Install Dependencies
        run: |
          docker exec "$MUSL_CONTAINER" \
            apk add --no-cache nodejs npm
          docker exec "$MUSL_CONTAINER" \
            python -m pip install cmake==3.30.0
          docker exec "$MUSL_CONTAINER" \
            npm ci --ignore-scripts

      - name: Build and Publish Bindings
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          docker exec \
            -e NODE_AUTH_TOKEN="$NODE_AUTH_TOKEN" \
            "$MUSL_CONTAINER" \
            npm config set '//registry.npmjs.org/:_authToken' "$NODE_AUTH_TOKEN"
          docker exec \
            -e NODE_AUTH_TOKEN="$NODE_AUTH_TOKEN" \
            "$MUSL_CONTAINER" \
            npm run publish:bindings -- --force

      - name: Tear Down musllinux Container
        if: always()
        run: docker rm -f "$MUSL_CONTAINER" || true

  publish-macos-bindings:
    name: Publish Bindings (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
          - name: macOS x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: |
          curl -sL https://cmake.org/files/v3.27/cmake-3.27.9-macos-universal.tar.gz | tar xz
          echo "$(pwd)/cmake-3.27.9-macos-universal/CMake.app/Contents/bin" >> $GITHUB_PATH
          npm install --ignore-scripts

      - name: Build and Publish Bindings
        run: npm run publish:bindings -- --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-windows-bindings:
    name: Publish Bindings (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
          - name: Windows arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python (Windows arm64)
        if: runner.arch == 'ARM64'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup MSVC Environment (Windows arm64)
        if: runner.arch == 'ARM64'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: arm64

      - name: Install Dependencies (Windows x64)
        if: runner.arch == 'X64'
        run: |
          Invoke-WebRequest -Uri "https://cmake.org/files/v3.27/cmake-3.27.9-windows-x86_64.zip" -OutFile cmake.zip
          Expand-Archive cmake.zip -DestinationPath cmake
          echo "$((Resolve-Path cmake\cmake-3.27.9-windows-x86_64\bin).Path)" >> $env:GITHUB_PATH
          npm install --ignore-scripts

      - name: Install Dependencies (Windows arm64)
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip cmake==3.30.0 ninja==1.11.1
          npm install --ignore-scripts

      - name: Build and Publish Bindings (Windows x64)
        if: runner.arch == 'X64'
        run: npm run publish:bindings -- --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build and Publish Bindings (Windows arm64)
        if: runner.arch == 'ARM64'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ZVEC_CMAKE_GENERATOR: Ninja
        run: |
          $env:RC = (Get-Command rc.exe -CommandType Application -ErrorAction Stop).Source
          npm run publish:bindings -- --force
